<div class="breadcrumb">
  <button type="button" class="breadcrumb__back" (click)="goHome.emit()" aria-label="Back to Home">←</button>
  <span class="breadcrumb__crumb">Community</span>
  <span class="breadcrumb__divider">/</span>
  <span class="breadcrumb__current">{{ tab() }}</span>
</div>

<div class="coming-soon">
  <span class="coming-soon__icon">
    <app-icon name="sparkles" [size]="22" />
  </span>
  <div class="coming-soon__title">{{ tab() }} is on its way</div>
  <p class="coming-soon__copy">This section is still being built — check back soon, or head back to Home in the meantime.</p>
  <button type="button" class="coming-soon__button" (click)="goHome.emit()">Back to Home</button>
</div>
