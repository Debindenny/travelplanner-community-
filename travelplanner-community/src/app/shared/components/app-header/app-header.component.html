<header class="topbar" role="banner">
  <div class="topbar__inner">
    <div class="topbar__brand">
      <div class="topbar__brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M2 12h20M12 2c3 3.5 3 16.5 0 20M12 2c-3 3.5-3 16.5 0 20"></path>
        </svg>
      </div>
      <div class="topbar__brand-divider" aria-hidden="true"></div>
      <span class="topbar__brand-name">TRAVL PLANR</span>
    </div>

    <nav class="topbar__nav" aria-label="Primary">
      @for (item of marketingNav; track item) {
        <a href="#" class="topbar__nav-link" [class.is-active]="item === 'Community'">{{ item }}</a>
      }
    </nav>

    <div class="topbar__actions" aria-label="Quick tools">
      <div class="topbar__locale">
        <span>US</span><span class="topbar__locale-accent">EN</span><span>/ INR</span>
      </div>
      <button type="button" class="topbar__icon" aria-label="Notifications">
        <app-icon name="bell" [size]="19" />
      </button>
      <button type="button" class="topbar__icon" aria-label="Messages">
        <app-icon name="mail" [size]="19" />
      </button>

      <div class="topbar__profile-wrap">
        <button type="button" class="topbar__profile" (click)="toggleProfile()" aria-label="Profile menu">AV</button>

        @if (profileOpen()) {
          <div class="profile-menu">
            <div class="profile-menu__header">
              <div class="profile-menu__name">avena1429</div>
              <div class="profile-menu__meta">Explorer · Lv.1 Wanderer · 14 countries</div>
            </div>
            @for (item of profileMenuItems; track item.label) {
              <button type="button" class="profile-menu__item" (click)="onSelectMenuItem(item)">
                <app-icon [name]="item.icon" [size]="15" />
                <span>{{ item.label }}</span>
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>
</header>
