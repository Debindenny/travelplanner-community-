<aside class="sidebar-nav">
  <nav class="sidebar-nav__list">
    @for (item of subnavItems; track item.tab) {
      <button
        type="button"
        class="sidebar-nav__item"
        [class.is-active]="activeTab() === item.tab"
        (click)="selectTab.emit(item.tab)"
      >
        <span class="sidebar-nav__icon">
          <app-icon [name]="item.icon" [size]="16" />
        </span>
        <span class="sidebar-nav__label">{{ item.tab }}</span>
        @if (item.count) {
          <span class="sidebar-nav__count">{{ item.count }}</span>
        }
      </button>
    }
  </nav>

  <div class="sidebar-nav__circles">
    <div class="sidebar-nav__circles-label">YOUR CIRCLES</div>
    @for (circle of circles(); track circle.id) {
      <button type="button" class="sidebar-nav__circle" (click)="selectCircle.emit(circle)">
        <span class="sidebar-nav__circle-thumb" [style.background-image]="'url(' + circle.image + ')'"></span>
        <span class="sidebar-nav__circle-name">{{ circle.name }}</span>
        @if (circle.live) {
          <span class="sidebar-nav__circle-dot"></span>
        }
      </button>
    }
  </div>

  <button type="button" class="sidebar-nav__share" (click)="share.emit()">
    <app-icon name="plus" [size]="16" />
    Share with travelers
  </button>
</aside>
