<div class="search-shell" aria-label="Community search">
  <app-icon name="search" [size]="16" class="search-shell__icon" />
  <input
    class="search-shell__input"
    type="text"
    [value]="value()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    placeholder="Search destinations, travelers, trips or tips"
    aria-label="Search destinations, travelers, trips or tips"
  />

  @if (open()) {
    <div class="suggestions">
      <div class="suggestions__label">SUGGESTIONS</div>
      @for (suggestion of suggestions(); track suggestion.label) {
        <button type="button" class="suggestions__item" (click)="onSelect(suggestion)">
          <span class="suggestions__icon">{{ suggestion.icon }}</span>
          <span class="suggestions__text">{{ suggestion.label }}</span>
          <span class="suggestions__spacer"></span>
          <span class="suggestions__kind">{{ suggestion.kind }}</span>
        </button>
      }
    </div>
  }
</div>
