<article class="event-card">
  <div class="event-card__banner" [style.background-image]="'url(' + event().image + ')'">
    <div class="event-card__date">
      <span class="event-card__date-month">{{ event().month }}</span>
      <span class="event-card__date-day">{{ event().day }}</span>
    </div>

    <span class="event-card__badge" [class]="'event-card__badge--' + event().badge.toLowerCase()">
      {{ event().badge }}
    </span>

    <div class="event-card__info">
      <h3 class="event-card__title">{{ event().title }}</h3>
      <p class="event-card__meta">{{ event().meta }}</p>
    </div>
  </div>

  <div class="event-card__footer">
    <span class="event-card__going">{{ event().travelersGoing }} travelers going</span>

    <div class="event-card__actions">
      <button type="button" class="event-card__button" (click)="details.emit(event())">Details</button>
      <button
        type="button"
        class="event-card__button event-card__button--join"
        [class.is-joined]="joined()"
        (click)="join.emit(event())"
      >
        {{ joined() ? 'Going' : 'Join' }}
      </button>
    </div>
  </div>
</article>
