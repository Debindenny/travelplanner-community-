<div class="home-tab">
  <app-hero-card
    [hasTrip]="store.hasUpcomingTrip()"
    [planText]="store.planText()"
    (planTextChange)="store.setPlanText($event)"
    (exploreDestination)="store.selectTab('Destinations')"
    (findTravelers)="store.selectTab('Travel Circles')"
    (openTrip)="store.selectTab('Trips')"
    (toggleHeroTrip)="store.toggleHeroTrip()"
    (buildItinerary)="store.planTrip()"
  />

  <app-story-rail [stories]="store.stories()" (openStory)="onOpenStory($event)" (addStory)="store.openComposerMenu()" />

  <div class="home-tab__grid">
    <div class="home-tab__feed">
      <app-feed-filter-bar
        [activeFilter]="store.filter()"
        [destinationFilter]="store.destinationFilter()"
        (selectFilter)="store.selectFilter($event)"
        (cycleDestination)="store.cycleDestinationFilter()"
      />

      @if (store.feedEmpty()) {
        <div class="empty-state">
          <span class="empty-state__icon">
            <app-icon name="compass" [size]="22" />
          </span>
          <div class="empty-state__title">Nothing in this filter yet</div>
          <p class="empty-state__copy">Try “For You”, or share something and start the conversation.</p>
          <button type="button" class="empty-state__button" (click)="store.openComposerMenu()">Share with travelers</button>
        </div>
      } @else {
        @for (post of store.visiblePosts(); track post.id) {
          <app-post-card
            [post]="post"
            [followed]="isFollowed(post.id)"
            [saved]="isSaved(post.id)"
            [helpfulOn]="isHelpfulOn(post.id)"
            [joined]="isJoined(post.id)"
            [commentsOpen]="isCommentsOpen(post.id)"
            [commentDraft]="draftFor(post.id)"
            [likedCommentIds]="store.commentLikeKeys()"
            [votedOptionId]="store.votedOptionFor(post.id)"
            (toggleFollow)="store.toggleFollow(post.id, post.author)"
            (deletePost)="store.deletePost(post.id)"
            (openOptions)="store.openPostOptions()"
            (toggleHelpful)="store.toggleHelpful(post.id)"
            (toggleComments)="store.toggleComments(post.id)"
            (toggleSave)="store.toggleSave(post.id)"
            (runCta)="store.runPostCta(post)"
            (votePoll)="store.votePoll(post.id, $event)"
            (likeComment)="store.likeComment(post.id, $event)"
            (replyToComment)="onReply(post.id, $event)"
            (commentDraftChange)="store.setCommentDraft(post.id, $event)"
            (submitComment)="store.postComment(post.id)"
          />
        }
      }

      @if (store.showSimilarTravelers()) {
        <app-similar-travelers
          [matches]="store.matches()"
          [followedIds]="store.followedIds()"
          (seeAll)="store.selectTab('Travel Circles')"
          (viewProfile)="store.showToast('Opening ' + $event.name + '’s profile')"
          (toggleFollow)="onToggleFollowTraveler($event)"
        />
      }
    </div>

    <app-community-sidebar
      [travelersRail]="store.travelersRail()"
      [trending]="store.trending()"
      [events]="store.events()"
      [followedIds]="store.followedIds()"
      [joinedIds]="store.joinedIds()"
      [inCrew]="store.inCrew()"
      [crewMessages]="store.crewMessages()"
      [crewDraft]="store.crewDraft()"
      [crewVotes]="store.crewVotes()"
      [crewRsvpIds]="store.crewRsvpIds()"
      [crewSettledIds]="store.crewSettledIds()"
      (toggleFollowTraveler)="onToggleFollowTraveler($event)"
      (createCircle)="store.openCircleForm()"
      (openTrending)="onOpenTrending($event)"
      (toggleJoinEvent)="onToggleJoinEvent($event)"
      (joinCrew)="store.joinCrew()"
      (crewDraftChange)="store.setCrewDraft($event)"
      (sendCrew)="store.sendCrew()"
      (addCrewCard)="store.addCrewCard($event)"
      (voteCrewPoll)="store.voteCrewPoll($event.messageId, $event.optionId)"
      (toggleCrewRsvp)="store.toggleCrewRsvp($event)"
      (toggleCrewSettled)="store.toggleCrewSettled($event)"
    />
  </div>
</div>
