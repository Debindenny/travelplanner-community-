<section class="hero" [style.background-image]="'url(' + destinationImage() + ')'">
  <span class="hero__overlay"></span>

  <div class="hero__content">
    @if (hasTrip()) {
      <div class="hero__copy">
        <div class="hero__badge">
          <span class="hero__badge-dot"></span>
          <span>YOUR NEXT TRIP · IN 18 DAYS</span>
        </div>
        <h1 class="hero__title">Paris, France</h1>
        <div class="hero__meta">
          <span>Jun 03 – Jun 06</span><span class="hero__meta-dot">·</span><span>3 nights</span><span class="hero__meta-dot">·</span><span>4 saved spots</span>
        </div>
        <div class="hero__actions">
          <button type="button" class="hero__button hero__button--solid" (click)="exploreDestination.emit()">Explore Paris</button>
          <button type="button" class="hero__button hero__button--ghost" (click)="findTravelers.emit()">Find travelers</button>
          <button type="button" class="hero__button hero__button--text" (click)="openTrip.emit()">Open my trip →</button>
        </div>
      </div>
    } @else {
      <div class="hero__copy">
        <h1 class="hero__title hero__title--compact">Where are you heading next?</h1>
        <p class="hero__lead">Plan a trip and this feed reshapes around your destination.</p>
        <button type="button" class="hero__button hero__button--solid" (click)="openTrip.emit()">Plan a trip</button>
      </div>
    }

    <div class="hero__planner">
      <div class="hero__planner-label">
        <app-icon name="sparkles" [size]="14" />
        <span>ITINERARY INSPIRATION</span>
      </div>
      <input
        class="hero__planner-input"
        type="text"
        [value]="planText()"
        (input)="planText.set($any($event.target).value)"
        placeholder="e.g. 5 relaxed days in Bali"
        aria-label="Trip planner"
      />
      <button type="button" class="hero__planner-submit" (click)="buildItinerary.emit()">Build my itinerary</button>
    </div>
  </div>

  <button type="button" class="hero__toggle" (click)="toggleHeroTrip.emit()">
    {{ hasTrip() ? 'Preview: no upcoming trip' : 'Preview: upcoming trip' }}
  </button>
</section>
