<div class="comment-section">
  @for (comment of comments(); track comment.id) {
    <div class="comment-row">
      <span class="comment-row__avatar" [style.background-image]="'url(' + avatarFor(comment.author) + ')'"></span>
      <div class="comment-row__body">
        <div class="comment-row__bubble">
          <span class="comment-row__author">{{ comment.author }}</span>
          <span class="comment-row__text">{{ comment.text }}</span>
        </div>
        <div class="comment-row__actions">
          <span class="comment-row__when">{{ comment.when }}</span>
          <button type="button" class="comment-row__like" [class.is-liked]="isLiked(comment.id)" (click)="likeComment.emit(comment.id)">
            {{ isLiked(comment.id) ? 'Liked' : 'Like' }} · {{ comment.likes + (isLiked(comment.id) ? 1 : 0) }}
          </button>
          <button type="button" class="comment-row__reply" (click)="reply.emit(comment)">
            <app-icon name="corner-down-right" [size]="12" />
            Reply
          </button>
        </div>
      </div>
    </div>
  }

  <div class="comment-composer">
    <span class="comment-composer__avatar">{{ authorInitials() }}</span>
    <input
      class="comment-composer__input"
      type="text"
      [value]="draft()"
      (input)="draftChange.emit($any($event.target).value)"
      (keydown.enter)="submit.emit()"
      placeholder="Add a helpful comment…"
      aria-label="Add a helpful comment"
    />
    <button type="button" class="comment-composer__submit" [class.is-ready]="draft().trim().length > 0" (click)="submit.emit()">Post</button>
  </div>
</div>
