<section class="feed-filter-bar" role="toolbar" aria-label="Feed filters">
  @for (filter of filters; track filter) {
    <button type="button" class="pill" [class.is-active]="activeFilter() === filter" (click)="selectFilter.emit(filter)">
      {{ filter }}
    </button>
  }

  <span class="feed-filter-bar__spacer"></span>

  <button type="button" class="destination-pill" (click)="cycleDestination.emit()">
    <app-icon name="map-pin" [size]="13" />
    Destination: {{ destinationFilter() }}
  </button>

  <div class="view-toggle">
    @for (mode of viewModes; track mode) {
      <button type="button" class="view-toggle__button" [class.is-active]="viewMode() === mode" (click)="selectViewMode.emit(mode)">
        {{ mode }}
      </button>
    }
  </div>
</section>
