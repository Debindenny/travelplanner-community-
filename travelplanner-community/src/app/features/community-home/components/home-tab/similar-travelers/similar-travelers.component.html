<article class="surface-card similar-travelers">
  <div class="similar-travelers__header">
    <h3 class="similar-travelers__title">Travelers with similar plans</h3>
    <button type="button" class="similar-travelers__see-all" (click)="seeAll.emit()">See all</button>
  </div>
  <p class="similar-travelers__lead">Matched on your Paris dates, pace and interests. Only travelers who made their trip discoverable appear here.</p>

  <div class="similar-travelers__list">
    @for (match of matches(); track match.id) {
      <div class="match-row">
        <span class="match-row__avatar" [style.background-image]="'url(' + avatarFor(match) + ')'"></span>
        <span class="match-row__identity">
          <span class="match-row__name-row">
            <span class="match-row__name">{{ match.name }}</span>
            <span class="match-row__percent">{{ match.matchPercent }}</span>
          </span>
          <span class="match-row__line">{{ match.home }} · {{ match.dates }} · {{ match.tags.join(' · ') }}</span>
        </span>
        <span class="match-row__actions">
          <button type="button" class="match-row__profile" (click)="viewProfile.emit(match)">Profile</button>
          <button type="button" class="match-row__follow" [class.is-following]="followedIds().has(match.id)" (click)="toggleFollow.emit(match)">
            {{ followedIds().has(match.id) ? 'Following' : 'Follow' }}
          </button>
        </span>
      </div>
    }
  </div>
</article>
