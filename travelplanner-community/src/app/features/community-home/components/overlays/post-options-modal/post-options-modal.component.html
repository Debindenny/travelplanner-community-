<div class="post-options">
  @for (item of menuItems; track item.label) {
    <button type="button" class="post-options__item" (click)="selectItem.emit(item)">
      <span class="post-options__label">{{ itemLabel(item) }}</span>
      <span class="post-options__hint">{{ item.hint }}</span>
    </button>
  }
</div>
