<div class="story-viewer" [style.background-image]="'url(' + story().image + ')'">
  <span class="story-viewer__scrim"></span>

  <span class="story-viewer__progress">
    <span class="story-viewer__progress-fill"></span>
  </span>

  <span class="story-viewer__header">
    <span class="story-viewer__avatar" [style.background-image]="'url(' + story().image + ')'"></span>
    <span class="story-viewer__identity">
      <span class="story-viewer__name">{{ story().name }}</span>
      <span class="story-viewer__place">{{ story().place }}</span>
    </span>
    <span class="story-viewer__status">{{ story().status }}</span>
    <button type="button" class="story-viewer__close" (click)="close.emit()" aria-label="Close story">
      <app-icon name="x" [size]="16" />
    </button>
  </span>

  <span class="story-viewer__note">{{ note() }}</span>

  <span class="story-viewer__actions">
    <button type="button" class="story-viewer__action story-viewer__action--follow" [class.is-followed]="followed()" (click)="toggleFollow.emit()" aria-label="Follow">
      <app-icon [name]="followed() ? 'check' : 'user-plus'" [size]="18" />
    </button>
    <button type="button" class="story-viewer__action" (click)="openTrip.emit()" aria-label="Open trip">
      <app-icon name="route" [size]="18" />
    </button>
    <button type="button" class="story-viewer__action" (click)="message.emit()" aria-label="Message">
      <app-icon name="message-circle" [size]="18" />
    </button>
    <span class="story-viewer__spacer"></span>
    <button type="button" class="story-viewer__action" [class.is-saved]="saved()" (click)="toggleSave.emit()" aria-label="Save">
      <app-icon name="bookmark" [size]="18" />
    </button>
  </span>
</div>
