<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Travl Planr — Redefining how the world travels</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI-powered itineraries tailored to your travel style, pace, and budget."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=4" />
    <script>
      (function () {
        var t = localStorage.getItem('travlplanr_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="m-0 font-poppins text-text-primary antialiased">
    <div style="display:contents">
      <app-root></app-root>
    </div>
  </body>
</html>
