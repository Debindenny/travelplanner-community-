<div class="ctm__body">
  <p class="ctm__intro">Answer four things and TRAVL AI rebuilds this route around your trip.</p>

  <label class="ctm__field">
    <span class="ctm__label">Starting from <span class="ctm__required">*</span></span>
    <input class="ctm__input" type="text" [value]="startingFrom()" (input)="startingFrom.set($any($event.target).value)" placeholder="e.g. Chennai" />
  </label>

  <label class="ctm__field">
    <span class="ctm__label">Arrival destination <span class="ctm__required">*</span></span>
    <input
      class="ctm__input"
      type="text"
      [value]="arrivalDestination()"
      (input)="arrivalDestination.set($any($event.target).value)"
      [placeholder]="destinationPlaceholder()"
    />
  </label>

  <div class="ctm__row">
    <label class="ctm__field">
      <span class="ctm__label">Start date <span class="ctm__required">*</span></span>
      <input class="ctm__input" type="date" [value]="startDate()" (input)="startDate.set($any($event.target).value)" placeholder="dd-mm-yyyy" />
    </label>
    <label class="ctm__field">
      <span class="ctm__label">End date <span class="ctm__required">*</span></span>
      <input class="ctm__input" type="date" [value]="endDate()" (input)="endDate.set($any($event.target).value)" placeholder="dd-mm-yyyy" />
    </label>
  </div>

  <div class="ctm__field">
    <span class="ctm__label">Travelers</span>
    <div class="ctm__stepper">
      <button type="button" class="ctm__stepper-btn" (click)="decrementTravelers()" aria-label="Fewer travelers">
        <app-icon name="minus" [size]="14" />
      </button>
      <span class="ctm__stepper-value">{{ travelers() }} traveler{{ travelers() === 1 ? '' : 's' }}</span>
      <button type="button" class="ctm__stepper-btn" (click)="incrementTravelers()" aria-label="More travelers">
        <app-icon name="plus" [size]="14" />
      </button>
    </div>
  </div>
</div>

<div class="ctm__footer">
  @if (missingFieldHint(); as hint) {
    <span class="ctm__hint">{{ hint }}</span>
  } @else {
    <span class="ctm__spacer"></span>
  }
  <button type="button" class="ctm__cancel" (click)="cancel.emit()">Cancel</button>
  <button type="button" class="ctm__build" [disabled]="!canGenerate()" (click)="onBuild()">
    <app-icon name="sparkles" [size]="14" />
    Generate itinerary
  </button>
</div>
