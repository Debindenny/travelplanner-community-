<div class="ds-outer">
  <div class="ds-shell">
    <aside class="ds-sidebar">
      <app-community-home-subnav (sharePost)="showComposerModal.set(true)" />
      <!-- <app-community-profile-summary class="mt-auto" [profile]="myProfile()" [userId]="user()?.id ?? null" /> -->
    </aside>

    <div class="ds-page">
      <app-ds-discover-tab />
    </div>
  </div>
</div>

@if (showComposerModal()) {
  <app-community-composer-modal
    (postCreated)="showComposerModal.set(false)"
    (close)="showComposerModal.set(false)"
  />
}

@switch (store.modal()?.kind) {
  @case ('discoverDetail') {
    @if (store.activeDiscoverItem(); as item) {
      <app-ds-modal-shell width="560px" [showHeader]="false" (close)="store.closeModal()">
        <app-ds-discover-detail-modal
          [item]="item"
          [saved]="store.savedIds().has(item.id)"
          [following]="store.followedIds().has('di_' + item.author)"
          (close)="store.closeModal()"
          (toggleSave)="store.toggleSave(item.id)"
          (toggleFollow)="store.toggleFollow('di_' + item.author, item.author)"
          (addToTrip)="store.openAddToTrip({ spot: item.title, meta: item.tag + ' · ' + item.place, image: item.image })"
        />
      </app-ds-modal-shell>
    }
  }
  @case ('addToTrip') {
    @if (store.activeAddToTripPayload(); as trip) {
      <app-ds-modal-shell title="Add to trip" subtitle="Bring this place straight into your itinerary." (close)="store.closeModal()">
        <app-ds-add-to-trip-modal
          [spot]="trip.spot"
          [spotMeta]="trip.meta"
          [spotImage]="trip.image"
          [trips]="store.tripPickOptions"
          [tripPick]="store.tripPick()"
          [days]="store.addDays()"
          [confirmationLine]="store.addConfirmationLine()"
          (pickTrip)="store.pickTrip($event)"
          (pickDay)="store.pickAddDay($event)"
          (cancel)="store.closeModal()"
          (confirm)="store.confirmAddToTrip()"
        />
      </app-ds-modal-shell>
    }
  }
}
