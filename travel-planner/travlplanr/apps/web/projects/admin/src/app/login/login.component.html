<div class="min-h-screen bg-surface-muted flex p-4 lg:p-8">
  <div class="flex flex-col md:flex-row w-full max-w-7xl mx-auto bg-white rounded-3xl shadow-sm overflow-hidden p-3 gap-4">

    <!-- Left Side: Informational Panel -->
    <div class="hidden md:flex w-1/2 bg-primary relative p-12 flex-col justify-center rounded-2xl overflow-hidden">
      <div class="z-10 -mt-32 max-w-md mx-auto text-center">
        <h2 class="text-3xl lg:text-4xl font-poppins font-semibold text-white leading-tight">
          Manage partners, bookings, and revenue in one place
        </h2>
      </div>
      <!-- Dashboard graphics placeholder -->
      <div class="absolute bottom-0 left-0 right-0 h-[60%] flex justify-center items-end">
        <div class="w-[80%] h-[120%] bg-white/10 rounded-t-xl border border-white/20 backdrop-blur-md"></div>
        <div class="absolute w-[90%] h-[100%] bg-white/20 rounded-t-xl border border-white/30 backdrop-blur-md"></div>
        <div class="absolute w-[100%] h-[80%] bg-white rounded-t-xl shadow-2xl flex flex-col overflow-hidden">
          <div class="h-8 border-b border-border-light flex items-center px-4 gap-2">
            <div class="w-2 h-2 rounded-full bg-red-400"></div>
            <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
            <div class="w-2 h-2 rounded-full bg-green-400"></div>
          </div>
          <div class="p-4 flex-1 bg-gray-50 flex gap-4">
            <div class="w-1/4 bg-white rounded-lg shadow-sm"></div>
            <div class="w-3/4 flex flex-col gap-4">
              <div class="h-1/2 bg-white rounded-lg shadow-sm"></div>
              <div class="h-1/2 flex gap-4">
                <div class="w-1/2 bg-white rounded-lg shadow-sm"></div>
                <div class="w-1/2 bg-white rounded-lg shadow-sm"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Side: Log In Form -->
    <div class="w-full md:w-1/2 px-8 py-12 md:px-16 lg:px-24 flex flex-col justify-center bg-white rounded-2xl">
      <div class="max-w-md w-full mx-auto">
        <!-- Header -->
        <div class="mb-8">
          <h2 class="text-2xl font-poppins font-semibold text-text-primary mb-2">Welcome to the Staff Portal</h2>
          <p class="text-text-secondary text-sm font-inter">Please enter your credentials to access the dashboard.</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg flex items-start gap-3">
            <svg class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm text-red-700 font-inter">{{ errorMessage }}</p>
          </div>
        }

        <!-- Form -->
        <form class="space-y-5" (ngSubmit)="onLogin($event)" novalidate>
          <!-- Email Input -->
          <div>
            <label for="login-email" class="block text-sm font-medium text-text-primary mb-2 font-inter">Email address</label>
            <div class="relative">
              <input
                id="login-email"
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="name@company.com"
                class="w-full px-4 py-3 rounded-lg border border-border-light bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-inter text-text-primary placeholder:text-gray-400"
                >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label for="login-password" class="block text-sm font-medium text-text-primary mb-2 font-inter">Password</label>
            <div class="relative">
              <input
                id="login-password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                placeholder="*********"
                class="w-full px-4 py-3 rounded-lg border border-border-light bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-inter text-text-primary placeholder:text-gray-400 tracking-widest"
                >
              <button type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                @if (!showPassword) {
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                }
                @if (showPassword) {
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                }
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full bg-primary hover:bg-primary-hover text-white font-medium py-3 rounded-lg transition-colors duration-200 font-inter mt-6 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            >
            @if (isLoading) {
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            }
            @if (!isLoading) {
              <span>Log In</span>
            }
            @if (isLoading) {
              <span>Logging in...</span>
            }
          </button>
        </form>

      </div>
    </div>
  </div>
</div>
