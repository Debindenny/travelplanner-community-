apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-worker-scaler
  namespace: travlplanr
spec:
  scaleTargetRef:
    name: ai-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
  - type: redis-streams
    metadata:
      address: ${REDIS_HOST}:6379
      stream: events:ai-worker
      consumerGroup: ai-worker-group
      pendingEntriesCount: "5"
