events {
    worker_connections 1024;
}

http {
    # Resolve Docker service names at request time so gateway survives container restarts
    # and can start even when optional upstreams are temporarily down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS Origin Mapping for Security
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" "$http_origin";
        "~^https?://([^/]+\.)?travlplanr\.com(:\d+)?$" "$http_origin";
        "~^https?://([^/]+\.)?yourdomain\.com(:\d+)?$" "$http_origin";
    }

    # --- Rate-limit zones (edge defense-in-depth; the app also rate-limits) ---
    # Keyed on client IP. The app reads X-Forwarded-For (set below) for its own limits.
    limit_req_zone $binary_remote_addr zone=auth_otp:10m   rate=12r/m;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m       rate=60r/m;
    limit_req_status 429;

    # CDN Emulation Cache
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CDN:10m inactive=24h max_size=1g;

    # Common proxy settings inherited by every location (locations no longer
    # need to repeat these; a location that sets its own would reset them).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # ---------------------------------------------------------------------------
    # PRODUCTION TLS: terminate HTTPS at the edge and add HSTS. Mount certs and
    # switch the customer/admin apps to https origins, then enable this block.
    #
    server {
        listen 443 ssl;
        http2 on;
        server_name api.yourdomain.com;
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        
        # Enable CORS using origin whitelist mapping
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        location / {
            # Route to 8080 block below or just proxy directly?
            proxy_pass http://localhost:8080;
        }
    }
    server { listen 80; server_name api.yourdomain.com; return 301 https://$host$request_uri; }
    # ---------------------------------------------------------------------------

    # Dev: accept localhost, domain, and LAN IP (admin/customer proxy with changeOrigin).
    server {
        listen 8080 default_server;
        server_name localhost dev.travlplanr.com 127.0.0.1 10.10.0.168 _;

        # Service-to-service endpoints must never be reachable from the public edge.
        location /api/v1/internal/ {
            return 404;
        }

        # --- Identity service ---
        # Tighter limits on OTP + admin login (more specific prefixes win).
        location /api/v1/auth/otp/ {
            limit_req zone=auth_otp burst=5 nodelay;
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location = /api/v1/auth/admin/login {
            limit_req zone=auth_login burst=10 nodelay;
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/auth/ {
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/me/ {
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/customers {
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/staff {
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/agents {
            set $upstream identity;
            proxy_pass http://$upstream:8000$request_uri;
        }

        # --- Planner service ---
        location /api/v1/chat {
            limit_req zone=chat burst=10 nodelay;
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/voice_socket {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;

            # WebSocket support (streaming voice endpoint)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location /api/v1/voice {
            limit_req zone=chat burst=10 nodelay;
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/trips {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/collaboration {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/contact {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/itineraries {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/destinations {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
            proxy_cache CDN;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Proxy-Cache $upstream_cache_status;
        }
        location /api/v1/geocode {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/public-config {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/packages {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
            proxy_cache CDN;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Proxy-Cache $upstream_cache_status;
        }
        location /api/v1/checkout {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/cms {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/promotions {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/destinations {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/support {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/reviews {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/blogs {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/cms/ {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/ai-learning {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        # Live inventory (TravelNext flights/cars, Booking hotels, attractions)
        # via the affiliate service. Planner still owns seeded inventory_items for chat
        # grounding; swap UI and AI hydration use this live path.
        location /api/v1/inventory {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-cars {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-holidays {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-events {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelomatix-hotels {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-transfers {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-rail {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-activities {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/travelnext-cruise {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /static {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/static {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/community {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /api/v1/matching {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/ws {
            set $upstream planner;
            proxy_pass http://$upstream:8000$request_uri;

            # WebSocket support (generation progress, DMs, notifications)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # --- Affiliate service ---
        location /api/v1/bookings {
            set $upstream affiliate;
            proxy_pass http://$upstream:8000$request_uri;
        }

        # --- Reporting service ---
        location /api/v1/admin/dashboard/ {
            set $upstream reporting;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/notifications {
            set $upstream reporting;
            proxy_pass http://$upstream:8000$request_uri;
        }
        location /api/v1/admin/ws {
            set $upstream reporting;
            proxy_pass http://$upstream:8000$request_uri;

            # WebSocket support (real-time dashboard metrics)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Health check
        location /health {
            set $upstream identity;
            proxy_pass http://$upstream:8000/health;
        }
    }
}
