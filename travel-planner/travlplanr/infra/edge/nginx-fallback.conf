# Self-signed fallback when Let's Encrypt certs are not mounted yet.
# Used only for local/LAN testing (https://10.10.0.168/).
# No IP catch-all here — LAN access via private IP is intentional for this profile.
# Production (nginx.conf) returns 444 for direct public-IP / unknown Host access.
events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name dev.travlplanr.com;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dev.travlplanr.com;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            proxy_pass http://host.docker.internal:4200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
