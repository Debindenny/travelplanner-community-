events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS edge for dev.travlplanr.com — terminates HTTPS on :443 and forwards
    # to the Angular dev server on the host (:4200). /api is proxied by ng
    # serve to the gateway on :8080.
    #
    # Certificates (first match wins in practice — use LE on the server):
    #   Production: /etc/letsencrypt/live/dev.travlplanr.com/  (Let's Encrypt)
    #   Fallback:   /etc/nginx/tls/                            (self-signed dev)

    server {
        listen 80;
        server_name dev.travlplanr.com;

        # ACME HTTP-01 (certbot renew / initial issue)
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dev.travlplanr.com;

        ssl_certificate     /etc/letsencrypt/live/dev.travlplanr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.travlplanr.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ACME (some validators follow the http→https redirect)
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        # Normalize accidental double-slash URLs (Vite dev server throws on "//")
        if ($request_uri ~ "^//+") {
            return 301 https://$host/;
        }

        location / {
            proxy_pass http://host.docker.internal:4200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }

    # ── dev.deepsynq.com ─────────────────────────────────────────────────────
    # DeepSynq runs as its own compose stack (projects/echarts) whose internal
    # edge binds the docker0 gateway on :8088, host-only. This terminates TLS for
    # it and forwards everything through. The canonical copy of this block lives
    # at echarts/deploy/front-door/dev.deepsynq.com.conf.

    server {
        listen 80;
        server_name dev.deepsynq.com;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dev.deepsynq.com;

        ssl_certificate     /etc/letsencrypt/live/dev.deepsynq.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.deepsynq.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        # Keep >= MAX_UPLOAD_SIZE in DeepSynq's .env; the smaller limit wins.
        client_max_body_size 1g;

        location / {
            proxy_pass http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # $remote_addr, NOT $proxy_add_x_forwarded_for. This is the only
            # internet-facing hop, so it must REPLACE any X-Forwarded-For the
            # client sent rather than prepend the real address behind it. The API
            # reads the first entry of the chain, so appending would let a client
            # choose its own "address": rotate the header per request and the
            # login rate limit never engages, and the audit log records whatever
            # the attacker typed.
            proxy_set_header X-Forwarded-For   $remote_addr;
            # Hard-coded https: this hop IS the TLS terminator.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    # Catch-all: drop connections for direct IP access or unknown Host headers.
    # Legitimate traffic must use https://dev.travlplanr.com (matched above).
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/dev.travlplanr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.travlplanr.com/privkey.pem;

        return 444;
    }
}
