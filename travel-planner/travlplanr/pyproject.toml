# Travlplanr — root Python tooling config (services use per-service pyproject.toml)

[tool.uv.workspace]
members = ["services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"
