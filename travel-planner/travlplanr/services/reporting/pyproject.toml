[project]
name = "travlplanr-reporting"
version = "0.1.0"
description = "Travlplanr Reporting Service — dashboard read models, audit events, notifications"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk[fastapi]>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
