[project]
name = "travlplanr-ai-worker"
version = "0.1.0"
description = "Travlplanr AI Worker — stateless Redis Streams consumer for Azure OpenAI generation"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "anthropic>=0.20.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
