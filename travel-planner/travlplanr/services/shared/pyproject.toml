[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "travlplanr-shared"
version = "0.1.0"
description = "Shared library for travlplanr services (config, db, auth, events, redis, logging, middleware)."
requires-python = ">=3.11"
# Runtime deps are installed per-service from their own requirements; listed here for completeness.
dependencies = [
    "sentry-sdk[fastapi]>=2.0.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "redis",
    "python-jose[cryptography]",
    "httpx>=0.27.0",
]

# Maps the import package `shared` to this directory, so that after
#   pip install -e services/shared
# every service can `from shared.x import ...` WITHOUT sys.path hacks.
[tool.setuptools]
packages = ["shared"]

[tool.setuptools.package-dir]
shared = "."

[tool.setuptools.package-data]
shared = ["data/*.json"]
